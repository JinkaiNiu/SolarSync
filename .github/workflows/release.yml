name: 构建并发布

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: 安装 .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 提取版本号
      shell: pwsh
      run: |
        $ver = Select-String -Path SolarSync.csproj -Pattern '<Version>(.+)</Version>' | % { $_.Matches.Groups[1].Value }
        echo "VERSION=$ver" >> $env:GITHUB_ENV

    - name: 编译发布单文件 EXE
      run: dotnet publish -c Release -r win-x64 --self-contained true

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: SolarSync-${{ env.VERSION }}
        path: bin/Release/net8.0-windows/win-x64/publish/SolarSync.exe

    - name: 创建或更新 Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $tag = "v$env:VERSION"
        $file = "bin/Release/net8.0-windows/win-x64/publish/SolarSync.exe"
        $notes = "自动构建 #$env:GITHUB_RUN_NUMBER`n提交: $env:GITHUB_SHA"
        gh release delete $tag --cleanup-tag --yes -R $env:GITHUB_REPOSITORY 2>$null
        gh release create $tag --title $tag --notes $notes $file -R $env:GITHUB_REPOSITORY
